version: "3.8"

services:
  db:
    image: mysql:8.0
    container_name: blog_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: blog
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  flyway:
    image: redgate/flyway
    container_name: blog_flyway
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./migrations:/flyway/sql
    entrypoint:
      - flyway
      - -url=jdbc:mysql://db:3306/blog?allowPublicKeyRetrieval=true&useSSL=false
      - -user=${MYSQL_USER}
      - -password=${MYSQL_PASSWORD}
      - migrate
    restart: "no"

  backend:
    image: ${DO_REGISTRY}/blog:backend-latest
    container_name: blog_backend
    restart: always
    depends_on:
      - db
    environment:
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_HOST=db
      - MYSQL_PORT=3306
      - API_URL=${API_URL}
      - CORS_ALLOWED_ORIGIN=${CORS_ALLOWED_ORIGIN}
    ports:
      - "8080:8080"

  blog:
    image: ${DO_REGISTRY}/blog:blog-latest
    container_name: blog_frontend
    restart: always

  nginx:
    image: ${DO_REGISTRY}/blog:nginx-latest
    container_name: blog_nginx
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
      - blog

volumes:
  db_data:
